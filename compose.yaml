services:
  server:
    image: mathiskrr/breizhsport-front:develop
    environment:
      NODE_ENV: production
    ports:
      - "4200:4200"
    depends_on:
      - api-gateway
      - cart-service
      - product-service
      - category-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4200/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  api-gateway:
    image: mathiskrr/breizhsport-api-gateway:develop
    ports:
      - 3000:3000
    environment:
      NODE_ENV: test
      PORT: 3000
    env_file: .env
    restart: unless-stopped

  cart-service:
    image: mathiskrr/breizhsport-cart:develop
    ports:
      - 4001:4001
    environment:
      NODE_ENV: test
      PORT: 4001
    env_file: .env
    restart: unless-stopped

  product-service:
    image: mathiskrr/breizhsport-product:develop
    ports:
      - 4002:4002
    environment:
      NODE_ENV: test
      PORT: 4002
    env_file: .env
    restart: unless-stopped

  category-service:
    image: mathiskrr/breizhsport-category:develop
    ports:
      - 4003:4003
    environment:
      NODE_ENV: test
      PORT: 4003
    env_file: .env
    restart: unless-stopped

  # Prometheus - Collecte de métriques
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # Grafana - Dashboard d'observabilité
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped
