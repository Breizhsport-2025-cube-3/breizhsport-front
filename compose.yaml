services:
  server:
    image: mathiskrr/breizhsport-front:develop
    environment:
      NODE_ENV: production
    ports:
      - "4200:4200"
    depends_on:
      - api-gateway
      - cart-service
      - product-service
      - category-service
      - auth-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4200/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  api-gateway:
    image: mathiskrr/breizhsport-api-gateway:develop
    ports:
      - 3000:3000
    environment:
      NODE_ENV: test
      PORT: 3000
      DB_NAME: breizhsport_data
      DB_USER: breizhsport_admin
      DB_PASSWORD: admin2026
      DB_HOST: mysql-breizhsport.alwaysdata.net
      DB_DIALECT: mysql
      CATEGORIES_SERVICE_URL: http://category-service:4003
      PRODUCT_SERVICE_URL: http://product-service:4002
      CART_SERVICE_URL: http://cart-service:4001
      AUTH_SERVICE_URL: http://auth-service:4004
    restart: unless-stopped

  cart-service:
    image: mathiskrr/breizhsport-cart:develop
    ports:
      - 4001:4001
    environment:
      NODE_ENV: test
      PORT: 4001
      DB_NAME: breizhsport_data
      DB_USER: breizhsport_admin
      DB_PASSWORD: admin2026
      DB_HOST: mysql-breizhsport.alwaysdata.net
      DB_DIALECT: mysql
    restart: unless-stopped

  product-service:
    image: mathiskrr/breizhsport-product:develop
    ports:
      - 4002:4002
    environment:
      NODE_ENV: test
      PORT: 4002
      DB_NAME: breizhsport_data
      DB_USER: breizhsport_admin
      DB_PASSWORD: admin2026
      DB_HOST: mysql-breizhsport.alwaysdata.net
      DB_DIALECT: mysql
    restart: unless-stopped

  category-service:
    image: mathiskrr/breizhsport-category:develop
    ports:
      - 4003:4003
    environment:
      NODE_ENV: test
      PORT: 4003
      DB_NAME: breizhsport_data
      DB_USER: breizhsport_admin
      DB_PASSWORD: admin2026
      DB_HOST: mysql-breizhsport.alwaysdata.net
      DB_DIALECT: mysql
    restart: unless-stopped

  auth-service:
    image: mathiskrr/breizhsport-auth:develop
    ports:
      - 4004:4004
    environment:
      NODE_ENV: test
      PORT: 4004
      DB_NAME: breizhsport_data
      DB_USER: breizhsport_admin
      DB_PASSWORD: admin2026
      DB_HOST: mysql-breizhsport.alwaysdata.net
      DB_DIALECT: mysql
      JWT_SECRET: 9f4c2e7b1a8d6c5f0e3b9a1c7d4e8f2b6a9c3d1e5f7a8b2c4d6e9f1a3b5c7d8
    restart: unless-stopped

  # Prometheus - Collecte de métriques
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # Grafana - Dashboard d'observabilité
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped
