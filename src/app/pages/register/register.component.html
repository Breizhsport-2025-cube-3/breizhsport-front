<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h1>Créer un compte</h1>
      <p>Rejoignez Breizhsport pour profiter de nos produits sportifs</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Prénom</label>
          <input
            type="text"
            id="firstName"
            class="form-control"
            [(ngModel)]="firstName"
            name="firstName"
            placeholder="Votre prénom"
            required
            autocomplete="given-name"
          />
        </div>

        <div class="form-group">
          <label for="lastName">Nom</label>
          <input
            type="text"
            id="lastName"
            class="form-control"
            [(ngModel)]="lastName"
            name="lastName"
            placeholder="Votre nom"
            required
            autocomplete="family-name"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Adresse email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          [(ngModel)]="email"
          name="email"
          placeholder="votre@email.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Minimum 8 caractères"
          required
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirmPassword"
          class="form-control"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirmez votre mot de passe"
          required
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-register" [disabled]="isLoading">
        <span *ngIf="!isLoading">Créer mon compte</span>
        <span *ngIf="isLoading">Création en cours...</span>
      </button>
    </form>

    <div class="register-footer">
      <p>Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
    </div>
  </div>
</div>
