name: CI - Tests & Quality

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Job 1: Code Quality & Unit Tests
  quality-and-unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint (Code Quality Analysis)
        run: npx ng lint --format=json > eslint-report.json || true

      - name: Run Unit Tests with Coverage
        run: npx ng test --watch=false --code-coverage --browsers=ChromeHeadless

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 5

  # Job 2: Build Verification
  build:
    runs-on: ubuntu-22.04
    needs: [quality-and-unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production
        run: npm run build

      - name: Verify Build Output
        run: |
          ls -la dist/breizhsport-front/browser/
          echo "Build successful - checking bundle sizes..."
          du -sh dist/breizhsport-front/browser/*

  # Job 3: E2E Tests with Cypress (non-bloquant si les microservices ne sont pas disponibles)
  e2e-tests:
    runs-on: ubuntu-22.04
    needs: [build]
    continue-on-error: true
    services:
      server:
        image: mathiskrr/breizhsport-front:develop
        env:
          CATEGORIES_SERVICE_URL: ${{secrets.CATEGORIES_SERVICE_URL}}
          PRODUCT_SERVICE_URL: ${{secrets.PRODUCT_SERVICE_URL}}
          CART_SERVICE_URL: ${{secrets.CART_SERVICE_URL}}
        ports:
          - 4200:4200
      api-gateway:
        image: mathiskrr/breizhsport-api-gateway:develop
        env:
          DB_NAME: ${{secrets.DB_NAME}}
          DB_USER: ${{secrets.DB_USER}}
          DB_PASSWORD: ${{secrets.DB_PASSWORD}}
          DB_HOST: ${{secrets.DB_HOST}}
          DB_DIALECT: ${{secrets.DB_DIALECT}}
          CATEGORIES_SERVICE_URL: ${{secrets.CATEGORIES_SERVICE_URL_LOCAL}}
          PRODUCT_SERVICE_URL: ${{secrets.PRODUCT_SERVICE_URL_LOCAL}}
          CART_SERVICE_URL: ${{secrets.CART_SERVICE_URL_LOCAL}}
        ports:
          - 3000:3000
      cart-service:
        image: mathiskrr/breizhsport-cart:develop
        env:
          DB_NAME: ${{secrets.DB_NAME}}
          DB_USER: ${{secrets.DB_USER}}
          DB_PASSWORD: ${{secrets.DB_PASSWORD}}
          DB_HOST: ${{secrets.DB_HOST}}
          DB_DIALECT: ${{secrets.DB_DIALECT}}
        ports:
          - 4001:4001
      product-service:
        image: mathiskrr/breizhsport-product:develop
        env:
          DB_NAME: ${{secrets.DB_NAME}}
          DB_USER: ${{secrets.DB_USER}}
          DB_PASSWORD: ${{secrets.DB_PASSWORD}}
          DB_HOST: ${{secrets.DB_HOST}}
          DB_DIALECT: ${{secrets.DB_DIALECT}}
        ports:
          - 4002:4002
      categorie-service:
        image: mathiskrr/breizhsport-category:develop
        env:
          DB_NAME: ${{secrets.DB_NAME}}
          DB_USER: ${{secrets.DB_USER}}
          DB_PASSWORD: ${{secrets.DB_PASSWORD}}
          DB_HOST: ${{secrets.DB_HOST}}
          DB_DIALECT: ${{secrets.DB_DIALECT}}
        ports:
          - 4003:4003

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Wait for Frontend to be ready
        run: npx wait-on http://localhost:4200 --timeout=60000

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          install: false

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 5

  # Job 4: Security Scan (OWASP ZAP) - non-bloquant
  security-scan:
    runs-on: ubuntu-22.04
    needs: [build]
    continue-on-error: true
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    services:
      server:
        image: mathiskrr/breizhsport-front:develop
        ports:
          - 4200:4200
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Wait for Frontend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:4200 > /dev/null && break || sleep 2
          done

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:4200'
          rules_file_name: 'reports/zap.yaml'
          cmd_options: '-a'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: report_html.html
          retention-days: 10

  # Job 5: Docker Publish (main branch only)
  publish-on-docker:
    needs: [quality-and-unit-tests, build]
    if: github.ref == 'refs/heads/main'
    uses: Breizhsport-2025-cube-3/breizhsport-infra/.github/workflows/publish_on_docker.yml@main
    secrets:
      tags: ${{ secrets.DOCKER_USERNAME }}/breizhsport-front:v0.1
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
